name: Запуск на разных ОС

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Запуск (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          ./start.sh --no-browser > start.log 2>&1 &
          for i in $(seq 300); do
            if curl -fs http://127.0.0.1:8765/api/health; then break; fi
            sleep 2
          done
          curl -fs http://127.0.0.1:8765/ | grep -q '<div id="root">'
          curl -fs http://127.0.0.1:8765/api/decks | grep -q demo
      - name: Запуск (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item Env:PSModulePath
          Start-Process powershell -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','scripts\launcher.ps1','-NoBrowser' -RedirectStandardOutput start.log -RedirectStandardError start.err
          for ($i = 0; $i -lt 300; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:8765/api/health -TimeoutSec 2; break } catch { Start-Sleep 2 }
          }
          if (-not ((Invoke-WebRequest http://127.0.0.1:8765/).Content -match '<div id="root">')) { throw 'Нет страницы игры' }
          if (-not ((Invoke-WebRequest http://127.0.0.1:8765/api/decks).Content -match 'demo')) { throw 'Нет демо-колоды' }
      - name: Журнал запуска
        if: always()
        shell: bash
        run: cat start.log start.err 2>/dev/null | tail -60 || true
