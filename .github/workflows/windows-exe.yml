name: Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Проверки и сборка установщика и portable EXE
        shell: powershell
        run: ./scripts/build-desktop.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: Study-Surfers-Windows-x64
          if-no-files-found: error
          path: |
            release/Study-Surfers-*.exe
            release/build-info.json
            release/SHA256SUMS.txt
            release/python-packages.txt
